[project]
name = "comfypanel"
description = "The Artisan’s Bridge between Adobe Photoshop and ComfyUI. Delivers real-time bidirectional canvas sync, an Edge-Cloud hybrid engine (RunningHub & BizyAir), interactive 3D/VR previews, and an essential suite of custom nodes for lossless image alignment, pause-control, and workflow logic."
version = "2.3.8"
license = { file = "LICENSE" }

dependencies = ["torch>=2.0.0", "torchvision", "numpy>=1.24.0", "Pillow>=9.0.0", "opencv-python>=4.8.0", "scipy>=1.10.0", "kornia>=0.7.0", "requests>=2.28.0", "aiohttp>=3.8.0", "typing-extensions>=4.0.0"]
keywords = ["comfyui", "custom-nodes", "ps", "photoshop", "photoshop plugin", "runninghub", "bizyair", "comfyui photoshop", "photoshop comfyui", "AnyPreview"]

[project.urls]
Repository = "https://github.com/Ginolazy/ComfyPanel"
Documentation = "https://github.com/Ginolazy/ComfyPanel/wiki"
"Bug Tracker" = "https://github.com/Ginolazy/ComfyPanel/issues"

[tool.comfy]
PublisherId = "ginolazy"
DisplayName = "ComfyPanel"
Icon = "https://raw.githubusercontent.com/Ginolazy/ComfyPanel/refs/heads/main/photoshop_plugin/ComfyPanel/icons/ComfyPanel.svg"
includes = []
comfyui_version = ">=0.2.0"

